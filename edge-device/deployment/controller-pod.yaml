apiVersion: v1
kind: Pod
metadata:
  name: iot-controller
spec:
  volumes:
  - name: shared-storage
    hostPath:
      path: /tmp/iot-shared
      type: DirectoryOrCreate

  containers:
  - name: controller
    image: python:3.11-slim-bookworm
    command: ["sh", "-c"]
    args:
      - |
        echo "Contrôleur central démarré. En attente des FIFO..."
        # Exemple basique : écouter tous les FIFO en parallèle ou séquentiellement
        # Vous pourrez remplacer cela par votre script Python de centralisation
        while true; do
          cat /shared/fifo-1 2>/dev/null || sleep 1
        done
    volumeMounts:
    - name: shared-storage
      mountPath: /shared