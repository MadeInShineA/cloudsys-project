apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: device-worker
spec:
  serviceName: "device-worker-service"
  replicas: 2
  selector:
    matchLabels:
      app: device-worker
  template:
    metadata:
      labels:
        app: device-worker
    spec:

      containers:
      - name: worker
        image: madeinshinea/cloud-project:worker-1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: shared-storage
          mountPath: /shared

      volumes:
        - name: shared-storage
          hostPath:
            path: /shared
            type: DirectoryOrCreate
