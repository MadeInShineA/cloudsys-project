apiVersion: v1
kind: Pod
metadata:
  name: iot-controller
  labels:
    app: iot-controller
spec:
  containers:
  - name: controller
    image: oglelehub/iot-controller:1.0.2
    imagePullPolicy: IfNotPresent
    env:
    - name: MQTT_HOST
      value: "172.17.0.1"
    - name: MQTT_PORT
      value: "1883"

    - name: DB_PATH
      value: "/shared/iot_data.db"
    - name: MAX_BYTES
      value: "4500"
    - name: POLL_INTERVAL
      value: "10.0"
    # -----------------------------------------------------------------

    volumeMounts:
    - name: shared-storage
      mountPath: /shared

  volumes:
    - name: shared-storage
      hostPath:
        path: /shared
        type: DirectoryOrCreate
