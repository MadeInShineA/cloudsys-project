apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: device-worker
spec:
  serviceName: "device-worker-service"
  replicas: 2
  selector:
    matchLabels:
      app: device-worker
  template:
    metadata:
      labels:
        app: device-worker
    spec:
      volumes:
      - name: shared-storage
        emptyDir: {}

      # On définit l'ID/Index directement comme variable d'environnement partagée 
      # grâce à l'API Kubernetes, accessible par tous les conteneurs du Pod.
      initContainers:
      - name: create-fifo
        image: alpine:latest
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command: ["sh", "-c"]
        args:
          - |
            # On extrait l'index une seule ici
            WORKER_INDEX=$(echo $POD_NAME | awk -F'-' '{print $NF}')
            mkfifo /shared/my-fifo-$WORKER_INDEX
            echo "FIFO /shared/my-fifo-$WORKER_INDEX créé."
        volumeMounts:
        - name: shared-storage
          mountPath: /shared

      containers:
      - name: simulator
        image: oglelehub/simulator:1.0.2
        imagePullPolicy: IfNotPresent
        env:
        # On récupère le nom du Pod proprement
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # On peut aussi injecter directement l'index ou l'ID global pour votre code Python
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command: ["sh", "-c"]
        args:
          - |
            # On extrait le même index, propre et sans script en double
            WORKER_INDEX=$(echo $POD_NAME | awk -F'-' '{print $NF}')
            
            python /app/device_simulator.py --config config.yaml --ground-truth ground_truth.log --number $WORKER_INDEX > /shared/my-fifo-$WORKER_INDEX
        volumeMounts:
        - name: shared-storage
          mountPath: /shared