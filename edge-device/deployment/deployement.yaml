apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: device-worker
spec:
  serviceName: "device-worker-service"
  replicas: 3
  selector:
    matchLabels:
      app: device-worker
  template:
    metadata:
      labels:
        app: device-worker
    spec:
      volumes:
      - name: shared-storage
        hostPath:
          path: /tmp/iot-shared
          type: DirectoryOrCreate

      containers:
      - name: worker
        image: oglelehub/iot-worker:1.0.2  # Votre nouvelle image construite avec le log_parser et l'entrypoint
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: shared-storage
          mountPath: /shared

---

apiVersion: v1
kind: Pod
metadata:
  name: iot-controller
  labels:
    app: iot-controller
spec:
  containers:
  - name: controller
    image: oglelehub/iot-controller:1.0.2
    imagePullPolicy: IfNotPresent
    
    # --- ON UTILISE DES VARIABLES D'ENVIRONNEMENT AU LIEU DES ARGS ---
    env:
    - name: MQTT_HOST
      value: "172.17.0.1"
    - name: MQTT_PORT
      value: "1883"
    - name: DB_PATH
      value: "/shared/iot_data.db"
    # -----------------------------------------------------------------

    volumeMounts:
    - name: shared-storage
      mountPath: /shared

  volumes:
  - name: shared-storage
    hostPath:
      path: /tmp/iot-shared
      type: DirectoryOrCreate